name: Encyclopedia Evidence Contract Validation
on:
  push:
    paths: ["schemas/encyclopedia/**", "examples/encyclopedias/**", ".github/scripts/encyclopedia_evidence_contract.py", ".github/workflows/encyclopedia-evidence-contract.yml"]
  pull_request:
    paths: ["schemas/encyclopedia/**", "examples/encyclopedias/**", ".github/scripts/encyclopedia_evidence_contract.py", ".github/workflows/encyclopedia-evidence-contract.yml"]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate portable contracts and RFC 9162 proof
        run: python .github/scripts/encyclopedia_evidence_contract.py
